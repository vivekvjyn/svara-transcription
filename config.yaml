model:
  embed_dim: 48
  depth: 5
  tcn_filters: 48
  tcn_kernel: 5
  tcn_dilations: 8
  dropout: 0.15
  segmenter_depth: 6
  boundary_std: 1.0
  boundary_threshold: 0.2
  boundary_radius: 2
  d3pm_steps: 8
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05

training:
  epochs: 100
  patience: 15
  batch_size: 16
  chunk: 2048
  warmup_epochs: 5
  lr_heads: 0.001
  lr_encoder: 0.0001
  weight_decay: 0.0001
  val_fraction: 0.2
  w_svara: 1.0
  w_boundary: 1.0
  crops_per_epoch: 2000
  validation_crops: 300

evaluation:
  min_note_frames: 5
  inference_chunk: 4096
  inference_overlap: 512
  match_window: 0.05
